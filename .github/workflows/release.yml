name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# Bump `mod.version` in stonecutter.properties.toml to match the tag first.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache auto-provisioned JDK toolchains
        uses: actions/cache@v6
        with:
          path: ~/.gradle/jdks
          key: gradle-jdks-${{ runner.os }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Root `build` fans out to both version subprojects (Stonecutter 0.9.7 has
      # no separate chiseledBuild task); the jars land in versions/<v>/build/libs.
      - name: Build all versions
        run: ./gradlew build --stacktrace

      # Both jars share mod.version but must publish under UNIQUE version numbers
      # (Modrinth enforces per-project uniqueness). Read the base version so each
      # step can suffix it with its Minecraft version, matching the jar's own
      # "<mod.version>+<mc>" identity.
      - name: Read mod version
        id: modver
        run: |
          version=$(grep -E '^mod\.version' stonecutter.properties.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Pull this version's section out of CHANGELOG.md for the release notes on
      # every platform (falls back to nothing if the version has no entry yet).
      - name: Extract changelog for this release
        id: changelog
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="${{ steps.modver.outputs.value }}" '
              /^## \[/ { if (s) exit; if (index($0, "[" ver "]")) { s=1; next } }
              /^\[[^]]+\]:/ { if (s) exit }
              s && (started || NF) { started=1; print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Two publishes, because the two jars target different Minecraft versions.
      # Each platform only activates when its token is present (GitHub Releases
      # always runs via the built-in token), so this is safe to keep even before
      # every platform is set up. Set these repo secrets / variables to enable:
      #   secret  MODRINTH_TOKEN     + variable MODRINTH_ID     (project id/slug)
      #   secret  CURSEFORGE_TOKEN   + variable CURSEFORGE_ID   (numeric project id)
      - name: Publish 1.21.1 jar
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Weathering Chamber ${{ github.ref_name }}
          version: ${{ steps.modver.outputs.value }}+1.21.1
          version-type: release
          changelog: ${{ steps.changelog.outputs.body }}
          loaders: fabric
          game-versions: |
            1.21
            1.21.1
          java: '21'
          dependencies: |
            fabric-api
          # Main jar only (mc-publish's documented exclude idiom; a bare "!" line
          # doesn't work — it also uploads a matching secondary file by default).
          files: versions/1.21.1/build/libs/!(*-@(dev|sources|javadoc)).jar

      - name: Publish 26.2 jar
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Weathering Chamber ${{ github.ref_name }}
          version: ${{ steps.modver.outputs.value }}+26.2
          version-type: release
          changelog: ${{ steps.changelog.outputs.body }}
          loaders: fabric
          game-versions: '26.2'
          java: '25'
          dependencies: |
            fabric-api
          files: versions/26.2/build/libs/!(*-@(dev|sources|javadoc)).jar
